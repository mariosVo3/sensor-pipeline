# Reviewer agent: runs automatically on every new or updated PR and posts review comments.
name: Agent - Reviewer

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: agent-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the reviewer agent. Review this pull request with a focus on:
            - Bugs and wrong behaviour
            - Missing or weak tests
            - Data validation problems (missing values, wrong types, out-of-range numbers)
            - Readability: the repo owner is learning Python, so flag code that is clever but hard to follow

            Note: The PR branch is already checked out in the current working directory.
            Use `gh pr comment` for top-level feedback. End it with one line:
            "Verdict: ready to merge" or "Verdict: needs changes".
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
