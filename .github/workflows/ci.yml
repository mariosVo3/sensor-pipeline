name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A real PostgreSQL for the database tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sensors
          POSTGRES_PASSWORD: sensors
          POSTGRES_DB: sensors
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sensors:sensors@localhost:5432/sensors
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
