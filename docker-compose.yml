services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sensors
      POSTGRES_PASSWORD: sensors   # local dev only
      POSTGRES_DB: sensors
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.0   # runs without Zookeeper (KRaft mode)
    ports:
      - "9092:9092"

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - kafka

volumes:
  pgdata:
